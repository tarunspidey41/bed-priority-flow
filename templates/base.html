<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .priority-critical { background-color: #dc3545; color: white; }
        .priority-high { background-color: #fd7e14; color: white; }
        .priority-medium { background-color: #ffc107; color: black; }
        .priority-low { background-color: #198754; color: white; }
        
        .status-available { border-color: #198754; color: #198754; }
        .status-occupied { border-color: #dc3545; color: #dc3545; }
        .status-maintenance { border-color: #ffc107; color: #ffc107; }
        
        .ward-icu { border-left: 4px solid #dc3545; }
        .ward-emergency { border-left: 4px solid #fd7e14; }
        .ward-general { border-left: 4px solid #ffc107; }
        .ward-surgery { border-left: 4px solid #198754; }
        
        .metric-card { transition: transform 0.2s; }
        .metric-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-hospital me-2"></i>
                Hospital Management System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('analytics') }}">Analytics</a>
                <a class="nav-link" href="{{ url_for('patient_bed_management') }}">Patient & Bed</a>
                <a class="nav-link" href="{{ url_for('discharge_management') }}">Discharge</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
